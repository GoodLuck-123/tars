board:
  target: firefly@10.106.0.220
  workspace: ~/livo2-workspace
  ssh_port: 22
build:
  jobs: 4
  seed_caches: []
dataset:
  path: /home/eric/data/hku_campus_seq_03.bag
  rate: 1.0
  start_s: 0
  duration_s: null
  tail_tolerance_s: 1.0
camera:
  width: 1280
  height: 1024
  scale: 0.5
  intrinsics:
  - 863.4241
  - 863.4171
  - 640.6808
  - 518.3392
  distortion:
  - -0.108
  - 0.105
  - -0.00012872
  - 5.7923e-05
  - -0.0222
extrinsics:
  R_camera_lidar:
  - -0.00113207
  - -0.9999999
  - 0.000504622
  - -0.0158688
  - -0.000486594
  - -0.999874
  - 0.999873
  - -0.00113994
  - -0.0158682
  t_camera_lidar:
  - -0.023321479654300002
  - 0.027724167903560002
  - 0.042068852325599995
  R_imu_lidar:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  t_imu_lidar:
  - 0.04165
  - 0.02326
  - -0.0284
  source_note: R3LIVE camera_ext_R/t are T_imu_camera (verified in upstream set_image_pose);
    T_camera_lidar = inverse(T_imu_camera) * T_imu_lidar; source local r3live_config.yaml,
    accuracy unverified
topics:
  lidar: /livox/lidar
  imu: /livox/imu
  compressed_image: /camera/image_color/compressed
  raw_image: /camera/image_raw          # 原始采集输入，与下方去畸变输出分开
  image: /livo2/image
run:
  timeout_s: 1800
  shutdown_timeout_s: 30
  drain_timeout_s: 300
  min_free_gib: 4
  map_chunk_frames: 100
monitoring:
  refresh_s: 2
  repeat_notice_s: 10
  progress_stall_s: 30
results_dir: results
algorithm:
  overrides: {}

# RK3588: A76 为 CPU 4–7；[] 表示交给系统调度。限制 OpenCV 线程以避免与算法抢核。
runtime:
  livo_cpus: [4, 5, 6, 7]
  opencv_threads: 1
  cpu_governor: performance  # 任务期间临时启用，结束/停止/异常后恢复；需板端 sudo -n，null 为不修改

# 硬件采集；相机型号/SDK 到位后接入命令。无硬件用 record --replay。
capture:
  camera_command: []
  image_transport: raw
  duration_s: 30
  replay_duration_s: 10
  buffer_mib: 256
  split_mib: 1024
  startup_timeout_s: 15
  stall_timeout_s: 5
  extra_topics: [/camera/camera_info]
  calibration_verified: false
  livox:
    ip: null                   # 已知 IP 时先发现并仅连接该设备；例如 192.168.1.189
    broadcast_codes: []
    publish_hz: 10
# 主机标定：原始图像 + 对应静态 PCD；结果作为候选，不自动覆盖外参。
calibration:
  image: null
  pcd: null
  use_rough_calib: false
  timeout_s: 600
  overrides: {}
