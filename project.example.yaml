# 唯一用户配置。路径相对本文件；输入数据和标定来自现有 R3LIVE 数据集。
board:
  target: firefly@10.106.0.220
  workspace: ~/livo2-workspace
  ssh_port: 22
build:
  jobs: 4
  seed_caches: []
dataset:
  path: /home/eric/data/hku_campus_seq_03.bag
  rate: 0.5
  start_s: 0
  duration_s: null
  tail_tolerance_s: 1.0
camera:
  width: 1280
  height: 1024
  scale: 0.5
  intrinsics: [863.4241, 863.4171, 640.6808, 518.3392] # fx, fy, cx, cy
  distortion: [-0.1080, 0.1050, -0.00012872, 0.000057923, -0.0222]
  # 解码器按全部五个系数去畸变，下游相机模型使用零畸变
extrinsics:
  # p_camera = R_camera_lidar * p_lidar + t_camera_lidar，长度单位米
  R_camera_lidar: [-0.00113207, -0.0158688, 0.999873, -0.9999999, -0.000486594, -0.00113994, 0.000504622, -0.999874, -0.0158682]
  t_camera_lidar: [0.0, 0.0, 0.0]
  # p_imu = R_imu_lidar * p_lidar + t_imu_lidar；AVIA 内置 IMU
  R_imu_lidar: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  t_imu_lidar: [0.04165, 0.02326, -0.0284]
  source_note: "camera: /home/eric/data/r3live_config.yaml; IMU: upstream AVIA config; functional validation, accuracy unverified"
topics:
  lidar: /livox/lidar
  imu: /livox/imu
  compressed_image: /camera/image_color/compressed
  image: /livo2/image
run:
  timeout_s: 1800
  shutdown_timeout_s: 30
  drain_timeout_s: 60
  min_free_gib: 4
  map_chunk_frames: 100
monitoring:
  refresh_s: 2
  repeat_notice_s: 10
  progress_stall_s: 30
results_dir: results
algorithm:
  overrides: {}
