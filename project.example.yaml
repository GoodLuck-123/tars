board:
  target: firefly@192.168.1.51   # 板子 SSH 地址；所有命令复用此处
  workspace: ~/livo2-workspace
  ssh_port: 22
  sync_time: true             # 空闲部署/启动时修正明显时钟误差；需要板端 sudo -n，不是精密传感器同步
build:
  jobs: 4
  seed_caches: []
dataset:
  path: /home/eric/data/hku_campus_seq_03.bag
  rate: 1.0
  start_s: 0
  duration_s: null
  tail_tolerance_s: 1.0
camera:
  width: 1280
  height: 1024
  scale: 0.5
  output_encoding: bgr8       # 实验可切为 mono8；算法主体始终接收灰度图
  intrinsics:
  - 863.4241
  - 863.4171
  - 640.6808
  - 518.3392
  distortion:
  - -0.108
  - 0.105
  - -0.00012872
  - 5.7923e-05
  - -0.0222
extrinsics:
  R_camera_lidar:
  - -0.00113207
  - -0.9999999
  - 0.000504622
  - -0.0158688
  - -0.000486594
  - -0.999874
  - 0.999873
  - -0.00113994
  - -0.0158682
  t_camera_lidar:
  - -0.023321479654300002
  - 0.027724167903560002
  - 0.042068852325599995
  R_imu_lidar:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  t_imu_lidar:
  - 0.04165
  - 0.02326
  - -0.0284
  source_note: R3LIVE camera_ext_R/t are T_imu_camera (verified in upstream set_image_pose);
    T_camera_lidar = inverse(T_imu_camera) * T_imu_lidar; source local r3live_config.yaml,
    accuracy unverified
topics:
  lidar: /livox/lidar
  imu: /livox/imu
  compressed_image: /camera/image_color/compressed
  raw_image: /camera/image_raw          # 原始采集输入，与下方去畸变输出分开
  image: /livo2/image
  camera_info: /camera/camera_info
  camera_metadata: /camera/metadata
run:
  timeout_s: 1800
  shutdown_timeout_s: 30
  drain_timeout_s: 300
  min_free_gib: 4
  map_chunk_frames: 100
monitoring:
  refresh_s: 2
  repeat_notice_s: 10
  progress_stall_s: 30
results_dir: results
transfer:
  delete_remote_bags_after_verify: true # 全部结果通过 SHA-256 校验并落盘后删除板端录包；false 保留双份
viewer:
  bag: null                  # null 自动选最近录包，也可填 bag 文件或录制目录
  max_points: 100000          # 仅显示抽样，不修改原始包
  image_tolerance_s: 0.15     # 按 bag 记录时间找最近图像，超出则显示缺帧
  bayer_gamma: 2.2           # 仅用于原始 Bayer 的屏幕显示；不修改录包像素
algorithm:
  overrides: {}

# RK3588: A76 为 CPU 4–7；[] 表示交给系统调度。限制 OpenCV 线程以避免与算法抢核。
runtime:
  livo_cpus: [4, 5, 6, 7]
  opencv_threads: 1
  cpu_governor: performance  # 任务期间临时启用，结束/停止/异常后恢复；需板端 sudo -n，null 为不修改

# 硬件采集：内置 FLIR USB3；其他相机通过 camera_command 接入。无硬件用 record --replay。
capture:
  camera_command: []          # 自定义相机 SDK 的入口；内置 spinnaker 无需填写
  compression: lz4            # 原始数据无损压缩，可选 none / lz4
  camera:
    type: spinnaker
    serial: "24223920"
    fps: 20.0
    pixel_format: BayerRG8    # 原始彩色 Bayer，回看时转 RGB，不改变录制数据
    width: 0                 # record 可用 0；live 算法模式请填实际 ROI 宽高
    height: 0                # 例如 1280x1024，必须与板端解码器输入一致
    offset_x: 0
    offset_y: 0
    exposure_auto: "Off"      # 默认全部手动；需要自动时才设 Continuous
    exposure_us: 10000.0      # 微秒：10000 = 10ms；按光照调整，须短于帧周期
    auto_exposure_max_us: 30000.0 # 室内上限 30ms；快速运动时调小并开大镜头光圈
    auto_gain_max_db: 18.0
    gamma_enabled: false     # 记录线性 Bayer，显示用 viewer.bayer_gamma
    gain_auto: "Off"
    gain_db: 12.0             # 固定增益，避免录制中亮度漂移
    white_balance_auto: "Off"
    white_balance_red: 1.68262
    white_balance_blue: 2.31433
  image_transport: raw
  duration_s: 30
  replay_duration_s: 10
  buffer_mib: 256
  split_mib: 1024
  startup_timeout_s: 15
  stall_timeout_s: 5
  extra_topics: [/camera/camera_info]
  calibration_verified: false
  livox:
    ip: 192.168.1.189           # AVIA 固定 IP；主机/板端都复用此处，仅连接该设备
    broadcast_codes: []
    publish_hz: 10
# 主机标定：原始图像 + 对应静态 PCD；结果作为候选，不自动覆盖外参。
calibration:
  image: null
  pcd: null
  use_rough_calib: false
  timeout_s: 600
  overrides: {}
